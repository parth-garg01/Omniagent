[project]
name = "nova-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn", "sqlalchemy>=2", "pydantic>=2", "pydantic-settings",
  "argon2-cffi", "email-validator", "httpx", "python-multipart", "pypdf", "python-docx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
